global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'distributed-neural-net'
    static_configs:
      - targets:
        - 'worker-0:8000'
        - 'worker-1:8001'
        - 'worker-2:8002'
        - 'worker-3:8003'

  - job_name: 'inference'
    static_configs:
      - targets:
          - 'inference-server:5001'