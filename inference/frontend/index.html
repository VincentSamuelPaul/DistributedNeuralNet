<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digit Recognizer</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: monospace; background: #1a1a1a; color: #fff; display: flex; justify-content: center; }
    h1 { text-align: center; }
    button { padding: 8px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; }
    #predict-btn { background: #4CAF50; color: white; }
    #clear-btn { background: #555; color: white; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const GRID = 28;
    const CELL = 16;
    const INFERENCE_URL = '/predict';

    function App() {
      const [grid, setGrid] = React.useState(Array(GRID * GRID).fill(0));
      const [result, setResult] = React.useState(null);
      const [drawing, setDrawing] = React.useState(false);

      const applyBrush = (g, idx) => {
        const next = [...g];
        const row = Math.floor(idx / GRID);
        const col = idx % GRID;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const r = row + dr, c = col + dc;
            if (r >= 0 && r < GRID && c >= 0 && c < GRID) {
              const i = r * GRID + c;
              const strength = dr === 0 && dc === 0 ? 1.0 : 0.4;
              next[i] = Math.min(1.0, next[i] + strength);
            }
          }
        }
        return next;
      };

      const handleCell = (idx) => setGrid(g => applyBrush(g, idx));

      const predict = async () => {
        const res = await fetch(INFERENCE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pixels: grid })
        });
        setResult(await res.json());
      };

      const clear = () => { setGrid(Array(GRID * GRID).fill(0)); setResult(null); };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: 32 }}>
          <h1>Digit Recognizer</h1>
          <div
            style={{ display: 'grid', gridTemplateColumns: `repeat(${GRID}, ${CELL}px)`, border: '2px solid #444', cursor: 'crosshair' }}
            onMouseLeave={() => setDrawing(false)}
          >
            {grid.map((val, i) => (
              <div key={i}
                onMouseDown={() => { setDrawing(true); handleCell(i); }}
                onMouseUp={() => setDrawing(false)}
                onMouseEnter={() => drawing && handleCell(i)}
                style={{ width: CELL, height: CELL, background: `rgb(${Math.round((1-val)*255)},${Math.round((1-val)*255)},${Math.round((1-val)*255)})` }}
              />
            ))}
          </div>
          <div style={{ marginTop: 16, display: 'flex', gap: 12 }}>
            <button id="predict-btn" onClick={predict}>Predict</button>
            <button id="clear-btn" onClick={clear}>Clear</button>
          </div>
          {result && (
            <div style={{ marginTop: 24, textAlign: 'center' }}>
              <h2 style={{ fontSize: 48 }}>Predicted: {result.digit}</h2>
              <div style={{ display: 'flex', gap: 8, marginTop: 12, alignItems: 'flex-end' }}>
                {result.probabilities.map((p, i) => (
                  <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <div style={{ height: 100, width: 28, background: '#333', display: 'flex', alignItems: 'flex-end' }}>
                      <div style={{ width: '100%', height: `${p * 100}%`, background: i === result.digit ? '#4CAF50' : '#2196F3' }} />
                    </div>
                    <span style={{ marginTop: 4 }}>{i}</span>
                    <span style={{ fontSize: 10, color: '#aaa' }}>{(p * 100).toFixed(0)}%</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
